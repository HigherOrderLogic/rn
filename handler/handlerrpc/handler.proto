syntax = "proto3";

option go_package = "unstable.build/go-tui/handler/handlerrpc";

import "term/termrpc/term.proto";

package handler;

message InstallResourceResponse {
	uint64 window_id = 1;
}

message ServerMessage {
	MessageType type = 1;
	DrawStreamRequest draw = 2;
	HandleStreamRequest handle = 3;
	ManStreamRequest man = 4;
	CloseStreamRequest close = 5;
	CursorStreamRequest cursor = 6;
	SelectionStreamRequest selection = 7;
	DimensionsStreamRequest dimensions = 8;
	ResizeStreamRequest resize = 9;

	InstallResourceResponse response = 10;
}

enum MessageType {
	Draw = 0;
	Handle = 1;
	Man = 2;
	Close = 3;
	Cursor = 4;
	Selection = 5;
	Dimensions = 6;
	Resize = 7;

	Request = 9;
	Response = 10;
}

message DrawStreamRequest {
	int32 width = 1;
	int32 height = 2;
}

message DrawStreamResponse {
	message Cursor {
		term.Coordinates position = 1;
		bool show = 2;
		int32 style = 3;
	}

	message Selection {
		string text = 1;
		bool ok = 2;
	}

	repeated term.CellRow rows = 1;
	Cursor cursor = 2;
	Selection selection = 3;
}

message HandleStreamRequest {
	term.Event event = 1;
}

message HandleStreamResponse {
	bool handled = 1;
	bool quit = 2;
    term.Event request = 3;
}

message ManStreamRequest {}

message ManStreamResponse {
	term.Manual man = 1;
}

message CursorStreamRequest {}

message CursorStreamResponse {
	term.Coordinates position = 1;
	bool show = 2;
	int32 style = 3;
}

message SelectionStreamRequest {}

message SelectionStreamResponse {
	string text = 1;
	bool ok = 2;
}

message DimensionsStreamRequest {}

message DimensionsStreamResponse {
	int32 width = 1;
	int32 height = 2;
}

message ResizeStreamRequest {
	int32 width = 1;
	int32 height = 2;
}

message CloseStreamRequest {
}

message CloseStreamResponse {}
