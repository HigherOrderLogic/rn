# ---------------------------------------------------------------------------
# Command prompt — additions to the active modeless overrides above
#
# The active block has already remapped `command.key` to <s-m-p>; you
# can replace that here. Aliases layer on top of built-ins: a string
# value is the substitution, a dict with `command` + `completer` adds
# completion. Set a key_binding value to "" to unbind a built-in.
# ---------------------------------------------------------------------------
# command:
#   history_key: <m-r>
#   max_history: 20000
#   aliases:
#     # Simple alias: `:w` runs `:write`.
#     w: write
#     # Alias with a completer: typing `:e <tab>` suggests files.
#     e:    {command: edit, completer: files}
#     # Alias with a shell completer (here: git branch names).
#     gitcheckout:
#       command:   "!! git -C $WORKSPACE_PATH checkout $1"
#       completer: '! git -C $WORKSPACE_PATH branch --format="%(refname:short)"'
#     conf: config

# ---------------------------------------------------------------------------
# LLM provider keys. The `models` block configures the router used by
# the agent and `:llm message`. Set `default` to any model your
# configured providers expose.
# ---------------------------------------------------------------------------
# models:
#   openai:
#     api_key:          ""
#     # reasoning_effort: ""   # none | minimal | low | medium | high | xhigh | max
#   anthropic:
#     api_key:          ""
#     # cache_control:    ""   # ephemeral | 5m | 1h | "" (disabled)
#   gemini:
#     api_key:          ""
#   codex:
#     base_url:         ""
#   custom:
#     url:              ""
#     api_key:          ""
#     available_models: {}     # name -> context window in tokens
#   local:
#     models_cache_dir: ""     # empty: $RUNE_DATADIR/models
#     n_gpu_layers:     -1     # negative offloads every supported layer
#     flash_attention:  false
