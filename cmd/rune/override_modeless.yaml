# Rune user configuration (modeless editor preset).
#
# The keys under "ACTIVE OVERRIDES" switch Rune into modeless editor
# mode and remap command bindings to the legacy runerc.modeless layout.
# Everything below those lines is commented out: uncomment what you
# want to change. The shown values are Rune's built-in defaults; see
# the embedded rune.star for the full schema and run `:config` from
# inside Rune to re-open this file.

# ---------------------------------------------------------------------------
# ACTIVE OVERRIDES — required for the modeless preset
# ---------------------------------------------------------------------------
editor:
  mode: modeless
  auto_pair: true
  modeless:
    attr: {fg: default, bg: default}
    bar_attr: {fg: default, bg: default}
    search_attr: {fg: grey, bg: yellow}
  status_bar:
    layout: '██▓▒░  {{ .Filepath }}  {{ .GitShortRef }}   {{ .GitDiffAdd | fg "green" }}   {{ .GitDiffDel | fg "red" }} {{ .ShiftRight }} {{ .CursorColumn }}:{{ .CursorLine }}  {{ .TotalLines }} lines  {{ .Language | bold }}  ░▒▓██'
terminal:
  modal: false
command:
  key: <s-m-p>
  key_bindings:
    "<m-s>": write
    "<a-m-s>": writeall
    "<m-q>": quit
    "<a-g>": searchtext
    "<m-r>": "echo {prompt}jumptoast<space>locals.scm<space>local.definition.type<space>"
    "<s-m-r>": searchtype
    "<m-;>": searchtext
    "<c-m-p>": "echo <s-m-p>workspacefocus{wait}<space>"
    "<m-f2>": "locationtoggle bookmark"
    "<f2>": "jumptolocation next bookmark"
    "<s-f2>": "jumptolocation previous bookmark"
    "<a-f2>": "locationhighlight bookmark"
    "<s-m-f2>": "locationdeleteall bookmark"
    "<a-m-right>": tabnext
    "<a-m-left>": tabprevious
    "<m-f>": searchtext
    "<m-g>": "jumptolocation next search"
    "<s-m-g>": "jumptolocation prev search"
    "<ctrl-->": "cursorhistory prev"
    "<ctrl-shift-->": "cursorhistory next"
    "<m-u>": "cursorhistory prev"
    "<s-m-u>": "cursorhistory next"
    "<m-,>": config
    "<s-m-]>": tabnext
    "<s-m-[>": tabprevious
    "<c-g>": "echo <esc>:"
    "<ctrl-meta-p>": "echo <esc>:workspacefocus<space>"
    "<alt-meta-down>": "lsp definition"
    "<f12>": "lsp definition"
    "<s-f12>": "lsp references"
    "<m-=>": "guifontsize increase"
    "<m-->": "guifontsize decrease"
    "<m-t>": tabnew
    "<a-s-right>": "tabmove right"
    "<a-s-left>": "tabmove left"
    "<m-n>": windownew
    "<m-c>": clipboardcopy
    "<m-v>": clipboardpaste
    "<m-left>": "windowfocus left"
    "<m-right>": "windowfocus right"
    "<m-down>": "windowfocus down"
    "<m-up>": "windowfocus up"
    "<s-m-left>": "windowmove left"
    "<s-m-right>": "windowmove right"
    "<s-m-down>": "windowmove down"
    "<s-m-up>": "windowmove up"
    "<c-s-m-backspace>": "windowresize reset"
    "<c-s-m-+>": ["windowresize max width", "windowresize max height"]
    "<c-s-m-->": ["windowresize min width", "windowresize min height"]
    "<c-s-m-up>": "windowresize increase height"
    "<c-s-m-down>": "windowresize decrease height"
    "<c-s-m-left>": "windowresize decrease width"
    "<c-s-m-right>": "windowresize increase width"
    "<s-m-w>": windowclose
    "<c-m-h>": "windowdefaultsplit h"
    "<c-m-v>": "windowdefaultsplit v"
    "<s-m-f>": windowtogglemaximize
    "<m-o>": "lsp hover"
    "<m-b>": "lsp format"
    "<m-m>": "go organize-imports"
    "<a-j>": gitnextchange
    "<a-k>": gitprevchange
    "<m-p>": searchfile
    "<m-\\\\>": searchtext
    "<m-enter>": terminalneworsplit
    "<s-m-enter>": "!"
    "gf": editfileoncursor
    "<m-1>": "workspacefocus 1"
    "<m-2>": "workspacefocus 2"
    "<m-3>": "workspacefocus 3"
    "<m-4>": "workspacefocus 4"
    "<m-5>": "workspacefocus 5"
    "<m-6>": "workspacefocus 6"
    "<m-7>": "workspacefocus 7"
    "<m-8>": "workspacefocus 8"
    "<m-9>": "workspacefocus 9"

# log_level: info               # debug | info | warn | error
# log_path: ~/.rune/debug.log

# ---------------------------------------------------------------------------
# GUI theme
#
# Rune ships a catalog of themes:
#   furman, romero, carmack, reynolds, brevik, thompson, pike, hopper,
#   kernighan, wozniak, auge, ritchie, kelleher, sanfilippo, greig, mullen
# Run `:guitheme` to preview live and `:colorPalette` to see named colors.
# Try `mullen` for a deep-purple / hot-pink feel, or `kernighan` for the
# classic Windows-Terminal palette.
# ---------------------------------------------------------------------------
# gui:
#   default_theme: romero
#   font_size: 13
#   line_height_offset: 0
#   column_width_offset: -1
#   window_opacity: {fg: 1, bg: 1}
#   window_blur_radius: 100
#   # Remap physical keys before they reach the editor (see the key-mapping
#   # docs). Both sides use the command key-binding syntax. <capslock>,
#   # <numlock>, <scrolllock> and <menu> only act when remapped here.
#   key_mapping:
#     "<capslock>": "<esc>"

# ---------------------------------------------------------------------------
# Editor behavior
# ---------------------------------------------------------------------------
# editor:
#   tabspaces: 4
#   ruler: 90
#   autoindent: true            # syntax-driven indentation
#   auto_save: false            # flush dirty buffers ~2s after last edit
#   initial_folds: true         # collapse language-defined folds on open

# ---------------------------------------------------------------------------
# Auxiliary bar (left of each editor pane)
# ---------------------------------------------------------------------------
# editor:
#   aux_bar:
#     enabled:          true
#     lines:            absolute   # disabled | absolute | relative
#     git:              inline     # bar | inline | all | disabled
#     folds:            true
#     icons:            true
#     highlight_cursor: true

# ---------------------------------------------------------------------------
# Editor status bar (bottom)
# ---------------------------------------------------------------------------
# editor:
