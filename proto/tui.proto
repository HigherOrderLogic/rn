syntax = "proto3";

option go_package = "github.com/ernestrc/go-tui/proto;proto";

import "term.proto";

package proto;

message Key {
	string id = 1;
	string description = 2;
	uint32 Char = 3;
	Event.Mod mod = 4;
	Event.Key key = 5;
}

message Manual {
	string summary = 1;
	repeated Key keys = 2;
}

message Coordinates {
	int32 X = 1;
	int32 Y = 2;
}
